customHeaders:
  - pattern: /assets/**
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "*.js"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "*.css"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: /basemaps/**
    headers:
      - key: Cache-Control
        value: public, max-age=604800
  - pattern: /data/**
    headers:
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: "**"
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-eval' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://data.rsmb.tv https://*.cartocdn.com https://*.basemaps.cartocdn.com; connect-src 'self' https://cloud.umami.is https://gateway.umami.is https://data.rcc-acis.org https://data.rsmb.tv https://*.cartocdn.com https://*.basemaps.cartocdn.com https://demotiles.maplibre.org; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"