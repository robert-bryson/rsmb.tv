version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install
        - if [ "$AWS_BRANCH" = "main" ]; then node scripts/verify-preview-revision.js; fi
        - npm install --global "$(node -p "require('./package.json').packageManager")"
        - npm ci --cache .npm --prefer-offline
    build:
      # Set CARTO_API_KEY in Amplify's build environment. Vite exposes only this
      # designated browser basemap key and rejects release builds without it.
      commands:
        - if [ "$AWS_BRANCH" = "dev" ]; then npm run build:dev; else npm run build; fi
    postBuild:
      commands:
        - if [ "$AWS_BRANCH" = "main" ]; then node scripts/verify-preview-revision.js; fi
        # A new artifact makes Amplify deploy and clear cached routing responses.
        - |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { AWS_COMMIT_ID: commitId, AWS_JOB_ID: jobId } = process.env;
            if (!commitId || !jobId) throw new Error("Missing Amplify build identity");
            writeFileSync("dist/deployment.json", JSON.stringify({ commitId, jobId }) + "\n");
          '
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
