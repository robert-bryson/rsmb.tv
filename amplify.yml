version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install
        - npm install --global "$(node -p "require('./package.json').packageManager")"
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
