version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    directory: "/projects/pins-of-inaccessibility"
    schedule:
      interval: "daily"
