name: Sync Temperatures

on:
  schedule:
    # Run at 7 AM UTC daily (1 AM CST / 2 AM CDT) — after ACIS daily data is finalized
    - cron: '0 7 * * *'
    # Refresh slower-moving all-time/state/county/trend records monthly.
    - cron: '30 8 1 * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Run full sync (all-time county records + state records). Default is recent-only.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-temperatures
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: us-east-1
      TEMPERATURE_DATA_BUCKET: rsmbtv-temperature-data
      TEMPERATURE_DATA_BASE_URL: https://data.rsmb.tv
      TEMPERATURE_DATA_CDN_ID: ${{ secrets.TEMP_DATA_CLOUDFRONT_ID }}
      TEMP_DATA_DIR: .temp/temperatures
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Determine sync mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "30 8 1 * *" ]]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "label=full" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.full_sync }}" == "true" ]]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "label=full" >> "$GITHUB_OUTPUT"
          else
            echo "args=--recent-only" >> "$GITHUB_OUTPUT"
            echo "label=recent-only" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync temperature records
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: node scripts/sync-temperatures.js ${{ steps.mode.outputs.args }}

      - name: Upload record files to S3
        if: env.TEMPERATURE_DATA_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          aws s3 sync public/data/temperatures/ "s3://${TEMPERATURE_DATA_BUCKET}/" \
            --content-type "application/json" \
            --cache-control "public, max-age=3600" \
            --exclude "*" \
            --include "*.json"
          echo "✅ Uploaded ${{ steps.mode.outputs.label }} record files to S3"

      - name: Upload daily observations and cache to S3
        if: env.TEMPERATURE_DATA_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -d "${TEMP_DATA_DIR}" ]]; then
            aws s3 sync "${TEMP_DATA_DIR}/" "s3://${TEMPERATURE_DATA_BUCKET}/" \
              --content-type "application/json" \
              --cache-control "public, max-age=86400"
            echo "✅ Uploaded daily observations, station index, and ACIS cache to S3"
          else
            echo "⚠️ No generated daily observations or cache to upload"
          fi

      - name: Invalidate CloudFront cache
        if: env.TEMPERATURE_DATA_CDN_ID != '' && env.TEMPERATURE_DATA_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.mode.outputs.label }}" == "full" ]]; then
            aws cloudfront create-invalidation \
              --distribution-id "${TEMPERATURE_DATA_CDN_ID}" \
              --paths "/stations.json" "/recentRecords.json" "/countyRecords.json" "/stateRecords.json" "/climateTrends.json" "/summary.json"
          else
            aws cloudfront create-invalidation \
              --distribution-id "${TEMPERATURE_DATA_CDN_ID}" \
              --paths "/stations.json" "/recentRecords.json"
          fi
