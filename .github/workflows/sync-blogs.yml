name: Sync Blogs

on:
  schedule:
    # Run at 9 AM UTC every Sunday after the workflow has been configured.
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-blogs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check blog sync configuration
        id: config
        env:
          GOOGLE_BLOG_SHEET_ID: ${{ vars.GOOGLE_BLOG_SHEET_ID || secrets.GOOGLE_BLOG_SHEET_ID }}
        run: |
          if [ -z "$GOOGLE_BLOG_SHEET_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_BLOG_SHEET_ID is not configured; skipping blog sync."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci

      - name: Sync blog posts from Google Docs and Sheets
        if: steps.config.outputs.configured == 'true'
        id: sync
        env:
          GOOGLE_BLOG_SHEET_ID: ${{ vars.GOOGLE_BLOG_SHEET_ID || secrets.GOOGLE_BLOG_SHEET_ID }}
          GOOGLE_BLOG_SHEET_NAME: ${{ vars.GOOGLE_BLOG_SHEET_NAME || secrets.GOOGLE_BLOG_SHEET_NAME }}
          GOOGLE_BLOG_REPLACE_ALL: ${{ vars.GOOGLE_BLOG_REPLACE_ALL || secrets.GOOGLE_BLOG_REPLACE_ALL }}
        run: npm run sync-blogs

      - name: Rebuild blog metadata artifacts
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm run build-og
          npm run build-rss
          npm run build-sitemap

      - name: Commit and push changes
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts.json src/content/blog public/rss.xml public/sitemap.xml public/og/blog
          git commit -m "chore: sync blog posts from Google Docs"
          git push
