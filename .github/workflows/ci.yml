name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mail-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Validate mail DNS without AWS access
        working-directory: infra
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform fmt -check mail.tf tests/mail.tftest.hcl
          terraform validate -no-color
          terraform test -no-color -filter=tests/mail.tftest.hcl

  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install configured npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Audit dependencies
        run: npm run audit

      - name: Test
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Production trip browser tests
        run: PLAYWRIGHT_WEBKIT=1 npm run test:trips:browser
