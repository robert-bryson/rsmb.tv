name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, mail-dns]
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      AWS_REGION: us-east-1
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      RELEASE_REVISION: ${{ github.sha }}
      RELEASE_VALIDATION_BUCKET: rsmbtv-temperature-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Git must see the existing preview's ancestry for a fast-forward push.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/install-ci-browsers.sh chromium
        timeout-minutes: 10
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 7200
      - name: Point preview branch at the candidate revision
        run: git push origin HEAD:refs/heads/release-preview
      - name: Validate hosted preview before production release
        run: node scripts/release-amplify.js
      - name: Retain release validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation
          path: release-validation.json
          if-no-files-found: ignore

  mail-dns:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1

      - name: Validate infrastructure without AWS access
        working-directory: infra
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform fmt -check -recursive
          terraform validate -no-color
          terraform test -no-color

  ci:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install configured npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate production bundle with fixture content
        run: npx vite build --mode trip-test

      - name: Audit dependencies
        run: npm run audit

      - name: Test
        run: npm test

      - name: Validate pins geometry and publication
        run: |
          python3 -m venv /tmp/pins-ci
          /tmp/pins-ci/bin/python -m pip install --requirement projects/pins-of-inaccessibility/requirements.txt
          /tmp/pins-ci/bin/python -m unittest discover -s projects/pins-of-inaccessibility/tests -v

      - name: Install Playwright browsers
        run: bash scripts/install-ci-browsers.sh chromium webkit
        timeout-minutes: 10

      - name: Hosted release validator integration
        run: npm run test:release-validation

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Pins map in WebKit
        run: PLAYWRIGHT_WEBKIT=1 npm run test:e2e -- tests/e2e/pins-map.spec.ts --project=webkit

      - name: Production accessibility, navigation, intent prefetch, and page recovery
        run: PLAYWRIGHT_WEBKIT=1 npm run test:page-recovery

      - name: Production temperature browser tests
        run: PLAYWRIGHT_WEBKIT=1 npm run test:temperatures:browser

      - name: Production trip browser tests
        run: PLAYWRIGHT_WEBKIT=1 npm run test:trips:browser -- --max-failures=1 --reporter=github

      - name: Preserve browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-failures
          path: |
            test-results/
            test-results-trips/
          if-no-files-found: ignore
          retention-days: 7
