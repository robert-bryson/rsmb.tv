name: Sync Tornado Tracks

on:
  schedule:
    # Run every Monday at 9 AM UTC — NOAA/NCEI typically finalizes the prior
    # week's data by then. Weekly cadence keeps the current year fresh;
    # historical years rarely change after finalization.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tornadoes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache NOAA StormEvents CSV downloads
        uses: actions/cache@v4
        with:
          path: .cache/tornado-tracks
          # Historical CSV filenames are stable once finalized. Bust cache
          # weekly so NOAA corrections to recent years are picked up.
          key: tornado-csv-${{ github.run_id }}
          restore-keys: |
            tornado-csv-

      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline

      - name: Sync tornado data (all years, cached downloads)
        # Full sync every run. Historical years are served from the CSV cache
        # above so only current/recent-year files are re-downloaded. Per-year
        # GeoJSON output is deterministic (no generatedAt timestamp), so git
        # will only show files that actually changed.
        run: node projects/tornado-tracks/scripts/syncTornadoes.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/tornadoes/
          if git diff --cached --quiet; then
            echo "No tornado data changes to commit."
          else
            git commit -m "chore: sync tornado track data from NOAA/NCEI"
            git push origin HEAD
          fi
